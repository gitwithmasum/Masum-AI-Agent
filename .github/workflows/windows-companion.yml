name: Build Windows Companion

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop_companion.py"
      - "dashboard.py"
      - "main.py"
      - "multi_agent.py"
      - "automation_engine.py"
      - "requirements-desktop.txt"
      - "build_windows_app.ps1"
      - "installer/**"
      - "dashboard/masum-ai-agent-logo.webp"
      - ".github/workflows/windows-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt
          python -m pip install -r requirements.txt

      - name: Create Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          python -c "from PIL import Image; Image.open('dashboard/masum-ai-agent-logo.webp').convert('RGBA').save('build/masum-ai-agent.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Build standalone EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MasumAIAgent --icon build\masum-ai-agent.ico --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all sounddevice --hidden-import pyttsx3.drivers --hidden-import pyttsx3.drivers.sapi5 desktop_companion.py

      - name: Build standalone AI Brain
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --console --name MasumAIBrain --icon build\masum-ai-agent.ico --add-data "dashboard;dashboard" --copy-metadata mcp --recursive-copy-metadata mcp --copy-metadata openai-agents --collect-all agents --collect-all openai --collect-all ddgs --collect-all pypdf --collect-all docx --collect-all googleapiclient --collect-all google_auth_oauthlib dashboard.py

      - name: Smoke test frozen AI Brain startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:DASHBOARD_AUTO_OPEN = "false"
          $env:DASHBOARD_HOST = "127.0.0.1"
          $env:DASHBOARD_PORT = "18765"
          $outLog = Join-Path $env:RUNNER_TEMP "masum-brain-stdout.log"
          $errLog = Join-Path $env:RUNNER_TEMP "masum-brain-stderr.log"
          $process = Start-Process -FilePath "$PWD\dist\MasumAIBrain.exe" -PassThru -NoNewWindow -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Seconds 2
              if ($process.HasExited) {
                throw "Frozen AI Brain exited prematurely with code $($process.ExitCode)"
              }
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/agents" -TimeoutSec 3
                if ($null -ne $response.agents) {
                  $ready = $true
                  break
                }
              } catch {
                # Waiting for frozen Python and FastAPI startup.
              }
            }
            if (-not $ready) {
              throw "Frozen AI Brain did not serve /api/agents within 180 seconds."
            }
            Write-Host "Frozen AI Brain smoke test passed."
          } finally {
            if (Test-Path $outLog) { Get-Content $outLog -Tail 100 }
            if (Test-Path $errLog) { Get-Content $errLog -Tail 120 }
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\MasumAI.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Masum-AI-Agent-Windows-Setup-v1.0.2-RC3
          path: installer-output/Masum-AI-Agent-Setup-v1.0.2-rc3.exe
          if-no-files-found: error
