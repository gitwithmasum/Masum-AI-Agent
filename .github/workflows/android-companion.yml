name: Build Android Companion APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build debug APK
        shell: bash
        run: |
          /tmp/gradle-8.9/bin/gradle -p mobile/android assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p mobile-apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile-apk/Masum-AI-Agent-Mobile-v5.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Masum-AI-Agent-Android-APK-v5.2
          path: mobile-apk/Masum-AI-Agent-Mobile-v5.2.apk
          if-no-files-found: error
