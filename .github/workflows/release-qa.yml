name: Release Candidate QA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop_companion.py"
      - "dashboard.py"
      - "main.py"
      - "multi_agent.py"
      - "automation_engine.py"
      - "mobile/android/**"
      - "installer/**"
      - "scripts/release_qa.py"
      - ".github/workflows/android-companion.yml"
      - ".github/workflows/windows-companion.yml"
      - ".github/workflows/release-qa.yml"
      - ".gitignore"

permissions:
  contents: read

jobs:
  static-and-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run release QA checks
        run: python scripts/release_qa.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build unsigned Android release for QA
        shell: bash
        run: |
          /tmp/gradle-8.9/bin/gradle -p mobile/android assembleRelease --stacktrace
          test -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload QA report
        uses: actions/upload-artifact@v4
        with:
          name: Masum-AI-Agent-v6.3-RC-QA
          path: release-qa-report.txt
          if-no-files-found: error
