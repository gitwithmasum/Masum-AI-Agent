plugins {
    id 'com.android.application'
}

def stableReleaseBuild =
    project.findProperty('stableRelease')?.toString()?.toBoolean() ?: false
def appVersionCode = stableReleaseBuild ? 10001 : 10002
def appVersionName = stableReleaseBuild ? '1.0.0' : '1.0.1-rc1'

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning =
    releaseKeystorePath != null &&
    !releaseKeystorePath.isBlank() &&
    releaseStorePassword != null &&
    !releaseStorePassword.isBlank() &&
    releaseKeyAlias != null &&
    !releaseKeyAlias.isBlank() &&
    releaseKeyPassword != null &&
    !releaseKeyPassword.isBlank()

android {
    namespace 'com.gitwithmasum.masumai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gitwithmasum.masumai'
        minSdk 26
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
}
